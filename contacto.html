<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Tienda Tecnológica</title>
    <link rel="stylesheet" href="estilosProductos.css">
    <link rel="stylesheet" href="contacto.js">
</head>
<body>
    <header>
        <h1>Tienda Tecnológica</h1>
        <h2>Contáctanos</h2>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="productos.html">Productos</a>
            <a href="acerca.html">Acerca de</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>
    <main>
        <h2 class="centrado">Envíanos un mensaje</h2>
        <form class="contacto" onsubmit="alert('Este formulario es una demostración y todavía no envía los datos.'); return false;">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>

            <label for="asunto">Asunto</label>
            <select id="asunto" name="asunto" required>
                <option value="">Selecciona un asunto</option>
                <option value="consulta">Consulta de producto</option>
                <option value="precio">Consulta de precio</option>
                <option value="otro">Otro</option>
            </select>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje" required></textarea>

            <p><button type="submit">Enviar mensaje</button></p>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Tienda Tecnológica. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
